[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mc9py"
version = "0.2.1"
description = "Python scripting layer for Micro-Cap 9: run analyses, read results, take native screenshots and build schematics from code (Linux + Wine, Windows)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DontforgetAntaiku" }]
keywords = ["micro-cap", "microcap", "mc9", "spice", "circuit-simulation", "electronics", "automation", "mcp", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Education",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["pytest>=8", "ruff>=0.6"]
tools = ["numpy", "scipy"]            # only for the calibration scripts in tools/

[project.scripts]
mc9 = "mc9.cli:main"
mc9-mcp = "mc9.server:main"

[project.urls]
Homepage = "https://github.com/DontforgetAntaiku/mc9py"
Documentation = "https://DontforgetAntaiku.github.io/mc9py/"
Issues = "https://github.com/DontforgetAntaiku/mc9py/issues"
Changelog = "https://github.com/DontforgetAntaiku/mc9py/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mc9"]
artifacts = ["src/mc9/_native/*"]          # mc9hook.dll & co, built by `make -C native package` (gitignored)

[tool.hatch.build.targets.sdist]
artifacts = ["src/mc9/_native/*"]
include = ["src/mc9", "native", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["mc9: needs MC9 (sandbox or Windows install); set MC9_INTEGRATION=1"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "E703", "E501", "B905", "UP007", "UP037", "E741", "E731", "B904", "UP045", "UP035", "UP006", "I001"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["UP031"]
"tools/*" = ["UP031", "E402"]
