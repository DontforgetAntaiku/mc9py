name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q          # offline tests only; MC9 integration tests are opt-in (MC9_INTEGRATION=1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install ruff
      - run: ruff check src tests

  native:
    name: build mc9hook.dll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - run: make -C native package
      - run: file src/mc9/_native/mc9hook.dll | grep -q "PE32 executable (DLL)"
      - uses: actions/upload-artifact@v4
        with: { name: mc9hook, path: src/mc9/_native/ }
