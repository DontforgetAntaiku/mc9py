name: Publish to PyPI
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }          # PyPI trusted publishing: no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - run: make -C native package            # the prebuilt hook is shipped inside the wheel
      - run: python -m pip install build && python -m build
      - run: unzip -l dist/*.whl | grep -q _native/mc9hook.dll
      - uses: pypa/gh-action-pypi-publish@release/v1
